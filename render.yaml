services:
  - type: web
    name: elhoda-shopify-ai-agent
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SHOPIFY_STORE_URL
        value: elhoda.net
      - key: SHOPIFY_API_VERSION
        value: 2024-04
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
