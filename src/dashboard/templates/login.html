<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | مساعد الذكاء الاصطناعي - متجر الهدى</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200/80 p-8 relative overflow-hidden">
        <!-- Decorative blur element -->
        <div class="absolute -top-16 -right-16 w-44 h-44 bg-emerald-100 rounded-full blur-2xl pointer-events-none"></div>
        <div class="absolute -bottom-16 -left-16 w-44 h-44 bg-teal-100 rounded-full blur-2xl pointer-events-none"></div>

        <div class="text-center mb-8 relative">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-700 text-white flex items-center justify-center text-3xl shadow-lg shadow-emerald-600/30 mb-4">
                🛍️
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">تسجيل الدخول للوحة التحكم</h1>
            <p class="text-xs text-slate-500 mt-1 font-semibold">مساعد الذكاء الاصطناعي لمتجر الهدى (elhoda.net)</p>
        </div>

        <!-- Error Message -->
        <div id="loginError" class="hidden mb-5 p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-sm"></i>
            <span id="errorMessage">اسم المستخدم أو كلمة المرور غير صحيحة.</span>
        </div>

        <form id="loginForm" class="space-y-4 relative">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">اسم المستخدم:</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute right-3.5 top-3.5 text-slate-400 text-sm"></i>
                    <input 
                        type="text" 
                        id="usernameInput" 
                        required 
                        placeholder="admin" 
                        class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                    />
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">كلمة المرور:</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute right-3.5 top-3.5 text-slate-400 text-sm"></i>
                    <input 
                        type="password" 
                        id="passwordInput" 
                        required 
                        placeholder="••••••••" 
                        class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition"
                    />
                </div>
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-700 hover:to-teal-800 text-white font-bold rounded-xl shadow-md shadow-emerald-700/20 active:scale-[0.98] transition flex items-center justify-center gap-2 text-sm mt-6"
            >
                <i class="fa-solid fa-right-to-bracket"></i>
                دخول إلى لوحة التحكم
            </button>
        </form>

        <div class="mt-6 pt-5 border-t border-slate-100 text-center">
            <p class="text-[11px] text-slate-400 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-shield-halved text-emerald-600"></i>
                نظام محمي ومشفر بالكامل بكلمة مرور
            </p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const errorDiv = document.getElementById('loginError');
            const submitBtn = document.getElementById('submitBtn');

            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارِ التحقق...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/';
                } else {
                    errorDiv.classList.remove('hidden');
                    document.getElementById('errorMessage').innerText = data.message || 'بيانات الدخول غير صحيحة';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> دخول إلى لوحة التحكم';
                }
            } catch (err) {
                errorDiv.classList.remove('hidden');
                document.getElementById('errorMessage').innerText = 'حدث خطأ في الاتصال بالخادم';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> دخول إلى لوحة التحكم';
            }
        });
    </script>
</body>
</html>
